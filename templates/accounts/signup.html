<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <title>Sign Up</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .signup-container {
            background: white;
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .signup-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .signup-header h1 {
            color: #1a202c;
            font-size: 1.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .signup-header p {
            color: #718096;
            font-size: 0.875rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            color: #4a5568;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
        }
        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .form-control:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        .btn {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover {
            background: #5a67d8;
        }
        .text-danger {
            color: #e53e3e;
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }
        .signin-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #718096;
            font-size: 0.875rem;
        }
        .signin-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        .signin-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <div class="signup-header">
            <h1>Create Account</h1>
            <p>Sign up for your account</p>
        </div>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Email Address</label>
                {{ form.email }}
                <span class="text-danger">{{ form.errors.email }}</span>
            </div>
            <div class="form-group">
                <label>Password</label>
                {{ form.password1 }}
                <span class="text-danger">{{ form.errors.password1 }}</span>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                {{ form.password2 }}
                <span class="text-danger">{{ form.errors.password2 }}</span>
            </div>
            <button type="submit" class="btn btn-primary">Create Account</button>
            <div class="signin-link">
                Already have an account? <a href="{% url 'accounts:signin' %}">Sign in</a>
            </div>
        </form>
    </div>
</body>
</html>
